name: Android APK

# 手动触发或推送 v* 标签时，在云端构建可侧载的 APK；
# release 包默认用仓库内 qingyu-release.p12 稳定签名（每次构建签名一致，应用内更新可覆盖安装），
# 也可配置签名 Secrets 覆盖为你自己的密钥。推送 v* 标签时自动创建 GitHub Release 并附上 APK。
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 构建 Web 产物
        run: npm run build

      - name: 生成移动端图标/启动屏源图
        run: npm run assets:mobile

      - name: 派生 Android 各密度原生资源
        run: npx capacitor-assets generate --android

      - name: 同步 Capacitor
        run: npx cap sync android

      - name: 安装 JDK 21（Capacitor 7 要求）
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 安装 Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: 检测签名 Secrets 是否已配置
        id: keystore_check
        run: echo "has=${{ secrets.ANDROID_KEYSTORE != '' }}" >> "$GITHUB_OUTPUT"

      - name: 可选：用 Secrets 覆盖 release 签名
        if: steps.keystore_check.outputs.has == 'true'
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE }}" | base64 -d > android/app/qingyu-release.jks
          cat > android/app/keystore.properties <<EOF
          storeFile=qingyu-release.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      - name: 构建 debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 构建 release APK（稳定密钥签名，可覆盖安装）
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: 上传 debug APK
        uses: actions/upload-artifact@v4
        with:
          name: qingyu-${{ github.ref_name }}-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: 上传 release APK
        uses: actions/upload-artifact@v4
        with:
          name: qingyu-${{ github.ref_name }}-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: 发布 GitHub Release（仅 tag 推送触发时）
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p rel
          # 固定发布稳定签名的 release APK（与历史版本同签名，可直接覆盖安装）
          APK_SRC=$(ls android/app/build/outputs/apk/release/*.apk | head -n1)
          echo "选用 APK: $APK_SRC"
          cp "$APK_SRC" "rel/qingyu-${TAG}-android.apk"
          # v1.7.0 随包发布 SHA-256 校验文件（sha256sum 标准格式：<hash>  <filename>），
          # 客户端下载完成后比对摘要，防传输损坏/资产被篡改（仅 Content-Length 不够）
          (cd rel && sha256sum "qingyu-${TAG}-android.apk" > "qingyu-${TAG}-android.apk.sha256")
          # Release 已存在（如重跑流水线）则只更新资产，否则创建并自动生成变更说明
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "rel/qingyu-${TAG}-android.apk" "rel/qingyu-${TAG}-android.apk.sha256" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "rel/qingyu-${TAG}-android.apk" "rel/qingyu-${TAG}-android.apk.sha256" \
              --repo "$GITHUB_REPOSITORY" \
              --title "轻语记账 $TAG" \
              --generate-notes
          fi

# ── release 签名 Secrets（可选覆盖，仓库 Settings → Secrets and variables → Actions）──
# 默认无需配置：CI 使用仓库内 android/app/qingyu-release.p12（密码 qingyu2026，别名 qingyu），
# 所有版本同签名，应用内下载更新可直接覆盖安装。
# 如需换成自己的密钥，再配置以下四项（build.gradle 检测到 keystore.properties 即优先使用）：
# ANDROID_KEYSTORE          base64 编码的 .jks/.p12（本地：base64 -w0 文件）
# ANDROID_KEYSTORE_PASSWORD  keystore 密码
# ANDROID_KEY_ALIAS         密钥别名
# ANDROID_KEY_PASSWORD       密钥密码
