name: Android APK

# 手动触发或推送 v* 标签时，在云端构建可侧载的 APK；
# 配置签名 Secrets 后额外产出可安装的 release APK（见末尾说明）。
# 推送 v* 标签时自动创建 GitHub Release 并附上重命名后的 APK。
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 构建 Web 产物
        run: npm run build

      - name: 生成移动端图标/启动屏源图
        run: npm run assets:mobile

      - name: 派生 Android 各密度原生资源
        run: npx capacitor-assets generate --android

      - name: 同步 Capacitor
        run: npx cap sync android

      - name: 安装 JDK 21（Capacitor 7 要求）
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 安装 Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: 检测签名 Secrets 是否已配置
        id: keystore_check
        run: echo "has=${{ secrets.ANDROID_KEYSTORE != '' }}" >> "$GITHUB_OUTPUT"

      - name: 准备 release 签名（仅在配置了 Secrets 时）
        if: steps.keystore_check.outputs.has == 'true'
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE }}" | base64 -d > android/app/qingyu-release.jks
          cat > android/app/keystore.properties <<EOF
          storeFile=qingyu-release.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      - name: 构建 debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 构建 release APK（配置签名后）
        if: steps.keystore_check.outputs.has == 'true'
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: 上传 debug APK
        uses: actions/upload-artifact@v4
        with:
          name: qingyu-${{ github.ref_name }}-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: 上传 release APK
        if: steps.keystore_check.outputs.has == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: qingyu-${{ github.ref_name }}-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: 发布 GitHub Release（仅 tag 推送触发时）
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p rel
          # 有签名 release APK 用之，否则回退 debug APK
          APK_SRC=$(ls android/app/build/outputs/apk/release/*.apk 2>/dev/null | head -n1 || true)
          [ -z "$APK_SRC" ] && APK_SRC=$(ls android/app/build/outputs/apk/debug/*.apk | head -n1)
          echo "选用 APK: $APK_SRC"
          cp "$APK_SRC" "rel/qingyu-${TAG}-android.apk"
          # Release 已存在（如重跑流水线）则只更新资产，否则创建并自动生成变更说明
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "rel/qingyu-${TAG}-android.apk" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "rel/qingyu-${TAG}-android.apk" \
              --repo "$GITHUB_REPOSITORY" \
              --title "轻语记账 $TAG" \
              --generate-notes
          fi

# ── release 签名 Secrets（可选，仓库 Settings → Secrets and variables → Actions）──
# ANDROID_KEYSTORE          base64 编码的 .jks（本地：base64 -w0 qingyu-release.jks）
# ANDROID_KEYSTORE_PASSWORD  keystore 密码
# ANDROID_KEY_ALIAS         密钥别名
# ANDROID_KEY_PASSWORD       密钥密码
# 未配置时只产出 debug APK，手机开启「允许安装未知来源应用」即可侧载。
