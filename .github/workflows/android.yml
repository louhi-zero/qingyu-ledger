name: Android APK

# 手动触发或推送 v* 标签时，在云端构建可侧载的 debug APK；
# 配置签名 Secrets 后额外产出可安装的 release APK（见末尾说明）。
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 构建 Web 产物
        run: npm run build

      - name: 生成移动端图标/启动屏源图
        run: npm run assets:mobile

      - name: 派生 Android 各密度原生资源
        run: npx capacitor-assets generate --android

      - name: 同步 Capacitor
        run: npx cap sync android

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: 准备 release 签名（仅在配置了 Secrets 时）
        if: ${{ secrets.ANDROID_KEYSTORE != '' }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE }}" | base64 -d > android/app/qingyu-release.jks
          cat > android/app/keystore.properties <<EOF
          storeFile=qingyu-release.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      - name: 构建 debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 构建 release APK（配置签名后）
        if: ${{ secrets.ANDROID_KEYSTORE != '' }}
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: 上传 debug APK
        uses: actions/upload-artifact@v4
        with:
          name: qingyu-1.1.0-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: 上传 release APK
        if: ${{ secrets.ANDROID_KEYSTORE != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: qingyu-1.1.0-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

# ── release 签名 Secrets（可选，仓库 Settings → Secrets and variables → Actions）──
# ANDROID_KEYSTORE          base64 编码的 .jks（本地：base64 -w0 qingyu-release.jks）
# ANDROID_KEYSTORE_PASSWORD  keystore 密码
# ANDROID_KEY_ALIAS         密钥别名
# ANDROID_KEY_PASSWORD       密钥密码
# 未配置时只产出 debug APK，手机开启「允许安装未知来源应用」即可侧载。
