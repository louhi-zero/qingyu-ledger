    <title>轻语记账</title>
    <style>
      /* v3.2 OPPO 等低端机启动灰屏修复：内联零 JS 启动画面。
         灰屏根因：原生 splash 收起后到 React 首帧之间 WebView 无内容可画（慢机上 1-3s），
         这段空窗只有整页底色。此处纯 HTML/CSS，WebView 一解析到 body 即渲染品牌启动页；
         React 挂载后 createRoot 整块替换 #root 内容，自动消失，无需清理逻辑。 */
      .boot-splash {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px;
        background: #f3f5fa;
      }
      .boot-icon { width: 88px; height: 88px; border-radius: 22px; animation: bootPulse 1.6s ease-in-out infinite; }
      .boot-bar { width: 120px; height: 4px; border-radius: 2px; background: #e4e8f2; overflow: hidden; }
      .boot-bar i { display: block; width: 40%; height: 100%; border-radius: 2px; background: #23272f; animation: bootSlide 1.2s ease-in-out infinite; }
      @keyframes bootPulse { 0%, 100% { transform: scale(1); opacity: 1 } 50% { transform: scale(.96); opacity: .82 } }
      @keyframes bootSlide { 0% { transform: translateX(-100%) } 100% { transform: translateX(300%) } }
      /* v3.3 启动兜底：bundle 未接管时不再无限停留，超时/报错即切到可恢复的失败页。
         失败页放在 #root 之外，React 清空容器不会把它一起删掉，故任何时刻都能显示。 */
      .boot-fail {
        position: fixed; inset: 0; z-index: 10000;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
        padding: 24px; box-sizing: border-box; background: #f3f5fa; text-align: center;
      }
      .boot-fail-title { font: 500 16px/1.4 system-ui, -apple-system, sans-serif; color: #23272f; }
      .boot-fail-msg { max-width: 320px; font: 400 12px/1.7 system-ui, -apple-system, sans-serif; color: #6b7280; white-space: pre-wrap; word-break: break-all; }
      .boot-fail-btn { min-width: 180px; padding: 11px 18px; border: 0; border-radius: 12px; background: #23272f; color: #fff; font: 500 14px/1 system-ui, -apple-system, sans-serif; }
      .boot-fail-btn.ghost { background: transparent; color: #6b7280; box-shadow: inset 0 0 0 1px #d5d9e2; }
      .boot-fail-hint { font: 400 11px/1.6 system-ui, -apple-system, sans-serif; color: #9aa1ad; }
    </style>
  </head>

    <div class="boot-fail" id="qyBootFail" hidden>
      <div class="boot-fail-title">启动没有完成</div>
      <div class="boot-fail-msg" id="qyBootMsg">应用界面未能在预期时间内加载。</div>
      <button class="boot-fail-btn" type="button" id="qyBootRetry">重新加载</button>
      <button class="boot-fail-btn ghost" type="button" id="qyBootClear">清除缓存并重启</button>
      <div class="boot-fail-hint">若反复出现，请截图本页反馈</div>
    </div>
    <script>
      /* v3.3 启动兜底 + 错误自报（早于应用 bundle 执行，普通脚本先于 module 脚本运行）。
         ① 超时/异常时把「永久卡在启动页」变成可恢复的失败页；
         ② 把真实错误渲染到页面上，用户截图即可反馈，不必连电脑调试；
         ③ 解除条件 = 主界面挂载后由 App.jsx 调用 window.__qyBootOk()；
            失败页放在 #root 之外，React 清空容器不会把它一起删掉，故始终可显示。 */
      (function () {
        var TIMEOUT = 10000
        var mounted = false
        var errs = []
        function text(v) {
          if (!v) return ''
          if (typeof v === 'string') return v
          return v.message || String(v)
        }
        function record(msg) {
          msg = String(msg || '').replace(/\s+/g, ' ').slice(0, 200)
          if (msg && errs.indexOf(msg) < 0) errs.push(msg)
        }
        function show(reason) {
          if (mounted) return
          try {
            var fail = document.getElementById('qyBootFail')
            if (!fail || !fail.hidden) return
            var boot = document.getElementById('qyBoot')
            if (boot) boot.style.display = 'none'
            var msg = document.getElementById('qyBootMsg')
            if (msg) msg.textContent = reason + (errs.length ? '\n' + errs.slice(0, 3).join('\n') : '')
            fail.hidden = false
          } catch (e) { /* 兜底页自身绝不抛错 */ }
        }
        window.__qyBootOk = function () { mounted = true }
        window.__qyBootFail = show
        window.addEventListener('error', function (e) {
          if (e && e.target && e.target !== window && e.target.src) {
            record('资源加载失败: ' + e.target.src)
          } else {
            record(text(e && (e.error || e.message)) || 'unknown error')
          }
          show('启动时发生错误')
        }, true)
        window.addEventListener('unhandledrejection', function (e) {
          record('Promise 未捕获: ' + (text(e && e.reason) || 'unknown'))
          show('启动时发生错误')
        })
        setTimeout(function () {
          show('加载超时（' + (TIMEOUT / 1000) + ' 秒内未完成）')
        }, TIMEOUT)
        document.getElementById('qyBootRetry').onclick = function () { location.reload() }
        document.getElementById('qyBootClear').onclick = function () {
          var go = function () { location.reload() }
          try {
            var jobs = []
            if (navigator.serviceWorker) {
              jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) {
                return Promise.all(rs.map(function (r) { return r.unregister() }))
              }))
            }
            if (window.caches) {
              jobs.push(caches.keys().then(function (ks) {
                return Promise.all(ks.map(function (k) { return caches.delete(k) }))
              }))
            }
            Promise.all(jobs).then(go, go)
            setTimeout(go, 1200)
          } catch (e) { go() }
        }
